
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APPSC Telugu Quiz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f2f4f8;margin:0;padding:15px;color:#222}
.container{max-width:850px;margin:auto;background:white;padding:18px;border-radius:12px}
h1{text-align:center;color:#174ea6}
button{background:#174ea6;color:white;border:0;padding:12px 18px;border-radius:7px;margin:6px;cursor:pointer}
input,select{padding:10px;margin:8px 0;max-width:100%}
.question{border:1px solid #ddd;padding:14px;margin:14px 0;border-radius:9px}
.option{display:block;padding:9px;margin:6px 0;background:#f3f5f9;border-radius:6px}
#quiz,#result{display:none}
#timer{font-size:20px;color:#c62828;font-weight:bold;text-align:right}
.correct{color:green;font-weight:bold}
.wrong{color:red;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h1>APPSC Telugu Quiz</h1>
<p>Upload your PDF containing MCQs and start your online test.</p>

<div id="upload">
<input type="file" id="pdfFile" accept=".pdf">
<br>
<label>Number of Questions:</label>
<select id="count">
<option value="75">75 Questions</option>
<option value="150">150 Questions</option>
</select>
<br>
<button onclick="loadPDF()">Upload PDF & Read Questions</button>
<p id="status"></p>
</div>

<div id="quiz">
<div id="timer">75:00</div>
<h3 id="progress"></h3>
<div id="questions"></div>
<button onclick="submitQuiz()">Submit Test</button>
</div>

<div id="result">
<h2>Test Result</h2>
<h3 id="score"></h3>
<div id="review"></div>
<button onclick="location.reload()">Another Attempt</button>
</div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let questions=[],answers={},timeLeft=75*60,clock;

async function loadPDF(){
 const file=document.getElementById('pdfFile').files[0];
 if(!file){alert('Please select a PDF file');return;}
 const status=document.getElementById('status');
 status.textContent='Reading PDF... Please wait.';
 try{
  const data=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data}).promise;
  let fullText='';
  for(let p=1;p<=pdf.numPages;p++){
   const page=await pdf.getPage(p);
   const content=await page.getTextContent();
   let lines={},items=content.items;
   items.forEach(item=>{
    let y=Math.round(item.transform[5]);
    if(!lines[y])lines[y]=[];
    lines[y].push(item.str);
   });
   Object.keys(lines).sort((a,b)=>b-a).forEach(y=>{
    fullText+=lines[y].join(' ')+'\n';
   });
  }
  questions=parseQuestions(fullText);
  const wanted=Number(document.getElementById('count').value);
  questions=questions.slice(0,wanted);
  if(questions.length===0){
   status.textContent='No MCQs detected. Your PDF format may need adjustment.';
   return;
  }
  status.textContent=questions.length+' questions detected.';
  setTimeout(startQuiz,700);
 }catch(e){
  status.textContent='Could not read this PDF. Try another text-based PDF.';
  console.error(e);
 }
}

function parseQuestions(text){
 const lines=text.replace(/\r/g,'').split('\n')
 .map(x=>x.trim()).filter(Boolean);
 let blocks=[],current=null;
 const start=/^(\d{1,3})[\.)]\s*(.+)$/;
 lines.forEach(line=>{
  let m=line.match(start);
  if(m && Number(m[1])>=1){
   if(current)blocks.push(current);
   current={number:Number(m[1]),text:m[2],options:[]};
  }else if(current){
   let opt=line.match(/^([A-Da-d])[\)\.]\s*(.+)$/);
   if(opt)current.options.push({key:opt[1].toUpperCase(),text:opt[2]});
   else if(current.options.length<4)current.text+=' '+line;
   else current.options[current.options.length-1].text+=' '+line;
  }
 });
 if(current)blocks.push(current);
 return blocks.filter(q=>q.options.length===4);
}

function startQuiz(){
 document.getElementById('upload').style.display='none';
 document.getElementById('quiz').style.display='block';
 renderQuestions();
 clock=setInterval(()=>{
  timeLeft--;
  let m=Math.floor(timeLeft/60),s=timeLeft%60;
  document.getElementById('timer').textContent=
   String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  if(timeLeft<=0)submitQuiz();
 },1000);
}

function renderQuestions(){
 const area=document.getElementById('questions');
 area.innerHTML='';
 questions.forEach((q,i)=>{
  let html='<div class="question"><b>Q'+(i+1)+'. '+q.text+'</b>';
  q.options.forEach(o=>{
   html+='<label class="option"><input type="radio" name="q'+i+
   '" value="'+o.key+'" onchange="answers['+i+']=\''+o.key+'\'"> '+
   o.key+'. '+o.text+'</label>';
  });
  html+='</div>';
  area.innerHTML+=html;
 });
 document.getElementById('progress').textContent=
 questions.length+' Questions | 1 mark each | 1/3 negative marking';
}

function submitQuiz(){
 clearInterval(clock);
 document.getElementById('quiz').style.display='none';
 document.getElementById('result').style.display='block';
 let attempted=0;
 questions.forEach((q,i)=>{if(answers[i])attempted++;});
 document.getElementById('score').textContent=
 'Questions: '+questions.length+' | Attempted: '+attempted+
 ' | Unanswered: '+(questions.length-attempted)+
 ' | Correct answers need an answer key to calculate the score.';
 let review=document.getElementById('review');
 review.innerHTML='<h3>Attempt Review</h3>';
 questions.forEach((q,i)=>{
  review.innerHTML+='<div class="question"><b>Q'+(i+1)+'. '+q.text+
  '</b><p>Your answer: '+(answers[i]||'Not attempted')+'</p>'+
  '<p>Options: '+q.options.map(o=>o.key+'. '+o.text).join(' | ')+'</p></div>';
 });
}
</script>
</body>
</html>
